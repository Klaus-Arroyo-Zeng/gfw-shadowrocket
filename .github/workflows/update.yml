
name: Update GFW Shadowrocket Rules

on:
  schedule:
    # 每天北京时间 06:30
    - cron: "30 22 * * *"

  workflow_dispatch:

  push:
    paths:
      - scripts/convert.py
      - .github/workflows/update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert Rules
        run: python scripts/convert.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Shadowrocket/GFW.list

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GFW Shadowrocket rules"
            git push
          fi
